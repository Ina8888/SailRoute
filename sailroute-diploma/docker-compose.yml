version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sailroute_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tues_password
      POSTGRES_DB: sailroute
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: